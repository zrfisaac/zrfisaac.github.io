<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZRFISAAC</title>
</head>
<body>
    <p>
        <a href="pt/index.html">Português</a>
        ·
        <a href="en/index.html">English</a>
    </p>

    <script>
        const savedLanguage = localStorage.getItem("zrf-language");
        const browserLanguage = navigator.language || "en";
        const defaultLanguage = browserLanguage.toLowerCase().startsWith("pt") ? "pt" : "en";
        const language = savedLanguage || defaultLanguage;

        location.replace(`${language}/index.html`);
    </script>
</body>
</html>
